<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">Maestria hosted mode</title>
  <desc id="d">A browser or phone reaches the Maestria service over HTTPS. The connector on your machine dials out to the service over a WebSocket, so no port is opened on your machine. The connector holds the data and the security decisions and talks to Maestri Wire on localhost, which talks to Maestri.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .s { fill: #59636e; font-size: 13px; }
    .k { fill: #59636e; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
    .a { fill: #0b5cd5; font-size: 13px; font-weight: 600; }
    .box { fill: #8b949e; fill-opacity: .10; stroke: #8b949e; stroke-width: 1.5; }
    .hot { fill: #2f81f7; fill-opacity: .13; stroke: #2f81f7; stroke-width: 2; }
    .zone { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .ln { fill: none; stroke: #8b949e; stroke-width: 2; }
    .lh { fill: none; stroke: #2f81f7; stroke-width: 2.5; }
    .arr { fill: #8b949e; }
    .arh { fill: #2f81f7; }
    @media (prefers-color-scheme: dark) {
      .h { fill: #e6edf3; }
      .s, .k { fill: #9198a1; }
      .a { fill: #79b8ff; }
      .box { fill-opacity: .14; }
      .hot { fill: #58a6ff; stroke: #58a6ff; fill-opacity: .16; }
      .lh { stroke: #58a6ff; }
      .arh { fill: #58a6ff; }
    }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arr"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arh"/></marker>
  </defs>

  <!-- Browser / phone -->
  <rect class="box" x="20" y="70" width="170" height="110" rx="14"/>
  <text class="h" x="105" y="118" text-anchor="middle">Browser or phone</text>
  <text class="s" x="105" y="140" text-anchor="middle">signs each request</text>
  <text class="s" x="105" y="158" text-anchor="middle">with its own key</text>

  <!-- Browser -> service -->
  <path class="ln" d="M192 125 H278" marker-end="url(#g)"/>
  <text class="s" x="235" y="112" text-anchor="middle">HTTPS</text>

  <!-- Maestria service -->
  <rect class="box" x="280" y="70" width="210" height="110" rx="14"/>
  <text class="h" x="385" y="104" text-anchor="middle">Maestria service</text>
  <text class="s" x="385" y="126" text-anchor="middle">maestria.example.com</text>
  <text class="s" x="385" y="146" text-anchor="middle">accounts, 2FA, relay</text>
  <text class="s" x="385" y="164" text-anchor="middle">stores no workspace data</text>

  <!-- Service <- connector (outbound) -->
  <path class="lh" d="M598 125 H492" marker-end="url(#b)"/>
  <text class="a" x="531" y="108" text-anchor="middle">outbound</text>
  <text class="a" x="531" y="150" text-anchor="middle">WSS</text>

  <!-- Your machine -->
  <rect class="zone" x="570" y="30" width="410" height="410" rx="18"/>
  <text class="k" x="590" y="56">Your machine</text>

  <!-- Connector -->
  <rect class="hot" x="600" y="70" width="350" height="110" rx="14"/>
  <text class="h" x="775" y="102" text-anchor="middle">Connector</text>
  <text class="s" x="775" y="124" text-anchor="middle">holds your data and your rules:</text>
  <text class="s" x="775" y="142" text-anchor="middle">allowlist, device approval,</text>
  <text class="s" x="775" y="160" text-anchor="middle">kill switch, audit log</text>

  <path class="ln" d="M775 182 V238" marker-end="url(#g)"/>
  <text class="s" x="790" y="216">localhost</text>

  <!-- Wire -->
  <rect class="box" x="600" y="240" width="350" height="62" rx="14"/>
  <text class="h" x="775" y="268" text-anchor="middle">Maestri Wire</text>
  <text class="s" x="775" y="288" text-anchor="middle">pinned certificate, read and owner devices</text>

  <path class="ln" d="M775 304 V348" marker-end="url(#g)"/>

  <!-- Maestri -->
  <rect class="box" x="600" y="350" width="350" height="70" rx="14"/>
  <text class="h" x="775" y="380" text-anchor="middle">Maestri</text>
  <text class="s" x="775" y="400" text-anchor="middle">agents, Maestro, floors</text>

  <!-- Notes under the left side -->
  <text class="k" x="20" y="262">What the service can do</text>
  <text class="s" x="20" y="286">Sign you in and tell you which machines are online.</text>
  <text class="s" x="20" y="306">Pass your signed requests along.</text>
  <text class="k" x="20" y="348">What it cannot do</text>
  <text class="s" x="20" y="372">Forge a command, read your data, or reach a route</text>
  <text class="s" x="20" y="392">the connector does not allow.</text>
  <text class="a" x="20" y="432">No port is opened on your machine.</text>
</svg>
