name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        # Failing tests become annotations on the run (readable without the full log).
        run: |
          set -o pipefail
          go test -json -count=1 ./... | go run ./tools/ciannotate

      - name: Check embedded design assets
        run: go run ./tools/syncdesign -check

      - name: Check go.mod tidiness
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      - name: Race tests (relay, devices, connect, cloud, auth, web, runlock)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./internal/relay/... ./internal/devices ./internal/connect ./internal/cloud ./internal/auth ./internal/web ./internal/runlock

      - name: Scan for known vulnerabilities (govulncheck)
        if: matrix.os == 'ubuntu-latest'
        # Pinned to an exact version and fetched through the Go module proxy, which checks it
        # against the checksum database. It reports only vulnerabilities the code can reach.
        shell: bash
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... > govulncheck.txt 2>&1
          status=$?
          cat govulncheck.txt
          if [ $status -ne 0 ]; then
            msg=$(tail -c 3000 govulncheck.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=govulncheck::${msg}"
          fi
          exit $status

      - name: Cross-compile release archives (maestria and maestria-cloud, all 5 targets)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go run ./tools/release -out dist/ci -version v0.0.0-ci -commit "${GITHUB_SHA}"
          test "$(grep -c ' maestria-cloud_0.0.0-ci_' dist/ci/SHA256SUMS)" = 5
          test "$(grep -c ' maestria_0.0.0-ci_' dist/ci/SHA256SUMS)" = 5
          grep -q ' maestria-cloud_0.0.0-ci_windows_amd64.zip$' dist/ci/SHA256SUMS
